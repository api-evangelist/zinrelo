aid: zinrelo
name: Zinrelo
review:
  question: Does Zinrelo expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: >
    No AsyncAPI document was authored. Zinrelo's documented public surface (the
    Loyalty API for members, points, transactions, rewards, and redemptions) is
    request/response REST over HTTPS. Zinrelo does support outbound webhooks -
    it POSTs event notifications to a configured endpoint and exposes a
    GET /events/{id} endpoint to retrieve event details - but webhooks are
    server-to-endpoint HTTP callbacks, not a server-push streaming transport
    (WebSocket or SSE) on Zinrelo's own API, so there is no bidirectional or
    streaming channel to model.
findings:
  summary: >
    Zinrelo does not publish a documented public WebSocket API. Zinrelo is an
    enterprise SaaS loyalty and rewards platform. Its public API is a REST
    Loyalty API under https://api.zinrelo.com, authenticated with a partner-id
    and an api-key sent as HTTP headers. The v1 surface is documented in the
    Zinrelo API reference (zinrelo.github.io/slate) and v2 loyalty and
    loyalty-storefront endpoints are documented in the Zinrelo help center
    (help.zinrelo.com, now redirecting to help.trueloyal.com as Zinrelo
    rebrands to TrueLoyal). All documented endpoints are request/response REST
    over HTTPS. Zinrelo delivers asynchronous notifications via outbound
    webhooks (HTTP callbacks with a GET /events/{id} lookup), not via a
    WebSocket. No realtime, bidirectional, or streaming WebSocket (ws:// or
    wss://) endpoint is documented on Zinrelo's own API as of the review date.
  accessModel: >
    The API reference documentation is public and self-serve to read, but API
    access is account-gated. Every request requires a partner-id and api-key
    provisioned to a Zinrelo account; there is no open, credit-card-free public
    API key. Pricing is quote-based via sales, with a free trial and a Shopify
    app tier free up to 500 loyalty members. In practice a working integration
    requires being a Zinrelo customer.
  endpointsModeled: >
    Endpoint paths, HTTP methods, authentication headers, and query parameters
    are drawn directly from Zinrelo's public documentation and are accurate.
    Request and response body schemas in the OpenAPI are honestly modeled from
    the public docs and examples, because Zinrelo does not publish a
    machine-readable OpenAPI with full field-level schemas. Field names and
    shapes should be verified against the live reference before production use.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.zinrelo.com
      documented: true
      note: >
        Loyalty API for members, points, transactions, rewards, and
        redemptions. v1 paths under /v1/loyalty and v2 paths under
        /v2/loyalty and /v2/loyalty-storefront.
    - protocol: Webhook
      scheme: https
      documented: true
      note: >
        Zinrelo POSTs event notifications to a configured HTTP endpoint and
        exposes GET /events/{id} to fetch event details. Server-to-endpoint
        HTTP callback, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: >
        No WebSocket endpoint is documented anywhere in Zinrelo's API reference
        or help center as of the review date.
  endpointsConfirmedRest:
    - POST   https://api.zinrelo.com/v1/loyalty/users
    - GET    https://api.zinrelo.com/v1/loyalty/users
