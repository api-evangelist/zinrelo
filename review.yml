sources:
  - url: https://zinrelo.github.io/slate/
    type: APIReference
    note: Classic v1 Loyalty API reference; partner-id and api-key headers; all REST. No WebSocket.
  - url: https://help.zinrelo.com/reference/introduction
    type: Documentation
    note: API overview; REST, authenticated with partner id and api key. Redirects to help.trueloyal.com.
  - url: https://help.zinrelo.com/reference/list-members-transaction-api
    type: APIReference
    note: GET /v2/loyalty-storefront/transactions with pagination and date/status filters.
  - url: https://help.zinrelo.com/reference/list-all-rewards
    type: APIReference
    note: GET /v2/loyalty/rewards, sorted by last_modified_date by default.
  - url: https://help.zinrelo.com/reference/perform-activity-api
    type: Documentation
    note: Perform Activity awards points to a member based on admin console configuration.
  - url: https://www.trueloyal.com/pricing/
    type: Pricing
    note: Quote-based pricing via sales; free trial; Shopify app free up to 500 members.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: >
    No WebSocket protocol surface exists, and Zinrelo's own public API is
    request/response REST plus outbound HTTP webhooks. No AsyncAPI document was
    created because there is no server-push streaming transport (WebSocket or
    SSE) on Zinrelo's own API to model; the webhook callbacks are one-way HTTP
    POSTs to a customer endpoint and carry their own out-of-scope delivery.
