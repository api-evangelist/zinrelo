aid: zinrelo
url: https://raw.githubusercontent.com/api-evangelist/zinrelo/refs/heads/main/apis.yml
name: Zinrelo
kind: company
description: >-
  Zinrelo is an enterprise SaaS loyalty and rewards platform that helps brands
  run holistic loyalty programs spanning transactional, social, advocacy,
  engagement, behavioral, and emotional loyalty across web, mobile, and in-store
  channels. Its documented REST Loyalty API lets you enroll and manage members,
  award and deduct points, record purchases and returns, list rewards, and
  redeem points for rewards. Every request is authenticated with a partner-id
  and an api-key sent as HTTP headers, both provisioned to a Zinrelo account.
  The API reference is public, but obtaining API credentials requires a Zinrelo
  account; pricing is quote-based via sales. Zinrelo is rebranding to TrueLoyal,
  and some documentation now lives under trueloyal.com domains.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Loyalty
- Rewards
- Points
- Customer Retention
- Ecommerce
- SaaS
