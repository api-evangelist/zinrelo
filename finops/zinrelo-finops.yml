description: >-
  FinOps view of Zinrelo spend. Zinrelo is an enterprise SaaS loyalty platform
  billed on a quote-based subscription rather than a metered pay-as-you-go API.
  The dominant cost driver is the loyalty program subscription, which scales
  with member volume and the feature set (holistic loyalty modules, analytics,
  and strategy consultation), plus possible overage fees when member counts
  exceed a plan allowance. The Loyalty API is included with a subscription and
  is not separately metered per call. There is no vendor API-usage invoice line
  to allocate the way a pure usage-based API would produce; cost allocation is
  primarily about the subscription and member-tier band.
notes: >-
  Zinrelo is rebranding to TrueLoyal. Per-plan rates are quote-based and not
  reconciled here; user reports mention overage fees of roughly 50 to 70 USD per
  month above contract. Confirm subscription tier, member bands, and overage
  terms with Zinrelo/TrueLoyal sales.
