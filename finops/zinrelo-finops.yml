principles:
- name: Visibility
  description: Track enrolled member counts against the plan allowance to anticipate overage charges.
- name: Allocation
  description: Map loyalty program subscription and overage to the marketing or retention cost center that owns the program.
- name: Optimization
  description: Prune inactive or unsubscribed members where terms allow, and right-size the plan member band to the active audience.
- name: Accountability
  description: Assign a program owner to review member growth, tier utilization, and overage against budget each billing cycle.
